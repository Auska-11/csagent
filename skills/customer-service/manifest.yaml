# Agent Skill Package 元数据
#
# 注意：这里的 Skill 是“指令与能力声明包”，不是 Java 中负责状态机决策的 Workflow。
# id 使用短横线，workflow 使用 Java Workflow 的稳定 ID；二者故意分开，避免概念混淆。
id: customer-service
name: customer-service       # 兼容旧文档和早期脚本，Loader 以 id 为准
version: 1.0.0
description: 通用客服兜底 Skill，只处理闲聊、感谢和模糊诉求澄清
workflow: customer_service
priority: 100

# 专业业务触发词已经归各自 Skill Package；这里只保留通用输入示例。
triggers:
  - 打招呼和感谢
  - 闲聊
  - 无法确定具体业务的模糊问题

# 通用兜底只生成回复或追问，不允许调用任何业务能力。
# 空列表是有意的最小权限声明，不是漏配。
allowed_capabilities: []

risk_level: read_only
confirmation_policy: none
prompt: SKILL.md

# Reference 使用规则由 Loader 解析成强类型对象。
# purposes 与 LLMAction.purpose 对应；triggers 则匹配当前用户消息和本次 prompt。
# 这样每次只加载真正需要的资料，而不是把四个文件全部塞给模型。
references:
  - path: references/persona.md
    purposes:
      - response_generation
  - path: references/templates.md
    purposes:
      - response_generation

# 意图分类
intents:
  - CHITCHAT         # 闲聊
  - OTHER            # 其他
