server:
  port: 8080

spring:
  application:
    name: smart-cs-agent

smartcs:
  handoff:
    # memory：默认生成本地模拟人工工单，适合单独启动 Agent 项目和跑测试。
    # after-sales-http：调用桌面 demo/after-sales-sla-platform 的售后工单接口创建真实工单。
    mode: ${SMARTCS_HANDOFF_MODE:memory}
    after-sales:
      base-url: ${SMARTCS_AFTER_SALES_BASE_URL:http://localhost:8081}
      tenant-id: ${SMARTCS_AFTER_SALES_TENANT_ID:demo}
      agent-user-id: ${SMARTCS_AFTER_SALES_AGENT_USER_ID:agent-service}
      agent-user-role: ${SMARTCS_AFTER_SALES_AGENT_USER_ROLE:AGENT}
  persistence:
    # memory：默认使用内存模拟数据，适合本地学习、测试和 CI。
    # jdbc：使用 JDBC 连接真实数据库，适合面试演示“业务数据持久化”。
    mode: ${SMARTCS_PERSISTENCE_MODE:memory}
    jdbc:
      driver-class-name: ${SMARTCS_JDBC_DRIVER:com.mysql.cj.jdbc.Driver}
      url: ${SMARTCS_JDBC_URL:jdbc:mysql://localhost:3306/smart_cs_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
      username: ${SMARTCS_JDBC_USERNAME:root}
      password: ${SMARTCS_JDBC_PASSWORD:}
  monitor:
    # Eval 候选样本默认保存到本地 data 目录。
    # 这样用户点“无用”后生成的待审核样本，项目重启后仍然可以继续审核。
    # 如果后续部署到服务器，可以通过环境变量 SMARTCS_MONITOR_EVAL_CANDIDATES_FILE 改成挂载目录。
    eval-candidates-file: ${SMARTCS_MONITOR_EVAL_CANDIDATES_FILE:data/feedback-eval-candidates.json}
    # 半自动合并 Eval 草稿时写入的回复质量评测文件。
    # 这个能力主要用于本地开发和面试演示：人工补齐断言后，再把 APPROVED 样本沉淀成正式回归测试。
    response-quality-eval-file: ${SMARTCS_MONITOR_RESPONSE_QUALITY_EVAL_FILE:src/test/resources/eval/response_quality_eval_cases.json}

langchain4j:
  open-ai:
    chat-model:
      # 不要把真实 API Key 写进配置文件。
      # 本地运行或 Docker 部署时，通过环境变量注入这些值。
      api-key: ${OPENAI_API_KEY:dummy-test-key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model-name: ${OPENAI_MODEL_NAME:dummy-model}
      temperature: 0.7
      max-tokens: 2000
      timeout: PT60S
      log-requests: true
      log-responses: true
