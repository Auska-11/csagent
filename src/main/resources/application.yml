server:
  port: 8080

management:
  endpoints:
    web:
      # 只暴露健康端点；env、configprops 等可能包含敏感配置，不允许公网读取。
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never
      group:
        # liveness 不依赖数据库，避免数据库故障触发容器反复重启。
        liveness:
          include: livenessState
        # readiness 失败时停止接收新流量，但 JVM 仍保持运行，便于依赖恢复。
        readiness:
          include: readinessState,persistence

spring:
  application:
    name: smart-cs-agent

smartcs:
  agent:
    # 防止错误 Workflow/Handler 无限返回 CONTINUE；这是步骤预算，不替代 HTTP/JDBC 超时。
    max-iterations: ${SMARTCS_AGENT_MAX_ITERATIONS:10}
    # 一轮对话从进入 Runtime 到最终收尾的 wall-clock 总预算，所有 LLM/Capability Action 共享。
    turn-timeout-ms: ${SMARTCS_AGENT_TURN_TIMEOUT_MS:30000}
  llm:
    execution:
      # 模型调用放入有界执行器。call-timeout 约束单个 LLM Action，Turn 余额可能进一步收紧它。
      call-timeout-ms: ${SMARTCS_LLM_EXECUTION_CALL_TIMEOUT_MS:12000}
      max-threads: ${SMARTCS_LLM_EXECUTION_MAX_THREADS:8}
      queue-capacity: ${SMARTCS_LLM_EXECUTION_QUEUE_CAPACITY:32}
  security:
    # 本地工作台通过 demo issuer 获取短期 JWT；生产环境必须设为 false，并由真实身份系统签发。
    demo-issuer-enabled: ${SMARTCS_SECURITY_DEMO_ISSUER_ENABLED:true}
    issuer: ${SMARTCS_SECURITY_ISSUER:smart-cs-agent}
    audience: ${SMARTCS_SECURITY_AUDIENCE:smart-cs-api}
    default-tenant-id: ${SMARTCS_SECURITY_DEFAULT_TENANT_ID:default}
    # HS256 至少需要 32 字节。这里的默认值只用于本地，部署时必须替换。
    jwt-secret: ${SMARTCS_SECURITY_JWT_SECRET:dev-only-smart-cs-agent-change-this-secret-32bytes}
    token-ttl-seconds: ${SMARTCS_SECURITY_TOKEN_TTL_SECONDS:28800}
    clock-skew-seconds: ${SMARTCS_SECURITY_CLOCK_SKEW_SECONDS:30}
  memory:
    # 长期偏好默认保留 30 天；重复表达同一偏好会刷新 TTL。
    preference-ttl-ms: ${SMARTCS_MEMORY_PREFERENCE_TTL_MS:2592000000}
    max-users: ${SMARTCS_MEMORY_MAX_USERS:10000}
    max-preferences-per-user: ${SMARTCS_MEMORY_MAX_PREFERENCES_PER_USER:20}
    max-preference-length: ${SMARTCS_MEMORY_MAX_PREFERENCE_LENGTH:80}
    summary-max-length: ${SMARTCS_MEMORY_SUMMARY_MAX_LENGTH:2000}
  capability:
    # local：直接调用本进程 Provider；mcp-remote：只使用远程 MCP；hybrid：本地为主并额外暴露带命名空间的远程能力。
    provider-mode: ${SMARTCS_CAPABILITY_PROVIDER_MODE:local}
    execution:
      # Provider 在线程池中执行，deadline 到期后请求线程不再无限等待。
      # 工作线程与排队请求都有上限，防止下游卡死时继续无限创建线程或堆积任务。
      max-threads: ${SMARTCS_CAPABILITY_EXECUTION_MAX_THREADS:16}
      queue-capacity: ${SMARTCS_CAPABILITY_EXECUTION_QUEUE_CAPACITY:64}
    idempotency:
      # jdbc 模式下，执行者先占有一段租约；实例崩溃后，其他实例只能等租约过期再接管。
      lease-ms: ${SMARTCS_IDEMPOTENCY_LEASE_MS:60000}
      # 同 key 的并发请求等待第一个执行者完成，超时后返回“仍在执行”，绝不绕过幂等层。
      wait-timeout-ms: ${SMARTCS_IDEMPOTENCY_WAIT_TIMEOUT_MS:30000}
      poll-interval-ms: ${SMARTCS_IDEMPOTENCY_POLL_INTERVAL_MS:50}
  mcp:
    server:
      server-id: ${SMARTCS_MCP_SERVER_ID:smart-cs-local}
    client:
      # 只有 provider-mode=mcp-remote 或 hybrid 时才会创建远程 MCP Client。
      base-url: ${SMARTCS_MCP_REMOTE_URL:http://localhost:8081/mcp}
      server-id: ${SMARTCS_MCP_REMOTE_SERVER_ID:remote-cs}
      # 远程服务签发的 MCP_CLIENT JWT；local 模式不需要配置。
      service-token: ${SMARTCS_MCP_REMOTE_TOKEN:}
      timeout-ms: ${SMARTCS_MCP_TIMEOUT_MS:10000}
      max-retries: ${SMARTCS_MCP_MAX_RETRIES:1}
      circuit-failure-threshold: ${SMARTCS_MCP_CIRCUIT_FAILURE_THRESHOLD:3}
      circuit-open-ms: ${SMARTCS_MCP_CIRCUIT_OPEN_MS:30000}
      discovery-cache-ttl-ms: ${SMARTCS_MCP_DISCOVERY_CACHE_TTL_MS:60000}
  rag:
    # local：默认使用 Markdown + 关键词 + 本地轻量向量分，不依赖外部服务。
    # embedding-qdrant：调用真实 embedding API，并使用 Qdrant 向量数据库检索知识库。
    mode: ${SMARTCS_RAG_MODE:local}
    embedding:
      base-url: ${SMARTCS_EMBEDDING_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com/v1}}
      api-key: ${SMARTCS_EMBEDDING_API_KEY:${OPENAI_API_KEY:dummy-test-key}}
      model-name: ${SMARTCS_EMBEDDING_MODEL_NAME:text-embedding-3-small}
      dimensions: ${SMARTCS_EMBEDDING_DIMENSIONS:1536}
      connect-timeout-ms: ${SMARTCS_EMBEDDING_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${SMARTCS_EMBEDDING_READ_TIMEOUT_MS:10000}
    qdrant:
      base-url: ${SMARTCS_QDRANT_BASE_URL:http://localhost:6333}
      collection-name: ${SMARTCS_QDRANT_COLLECTION:smart_cs_knowledge}
      connect-timeout-ms: ${SMARTCS_QDRANT_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${SMARTCS_QDRANT_READ_TIMEOUT_MS:10000}
  handoff:
    # memory：默认生成本地模拟人工工单，适合单独启动 Agent 项目和跑测试。
    # after-sales-http：调用桌面 demo/after-sales-sla-platform 的售后工单接口创建真实工单。
    mode: ${SMARTCS_HANDOFF_MODE:memory}
    after-sales:
      base-url: ${SMARTCS_AFTER_SALES_BASE_URL:http://localhost:8081}
      # X-Tenant-Id 来自当前已认证请求的 ExecutionContext，不允许用一份全局配置覆盖所有租户。
      agent-user-id: ${SMARTCS_AFTER_SALES_AGENT_USER_ID:agent-service}
      agent-user-role: ${SMARTCS_AFTER_SALES_AGENT_USER_ROLE:AGENT}
      connect-timeout-ms: ${SMARTCS_AFTER_SALES_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${SMARTCS_AFTER_SALES_READ_TIMEOUT_MS:10000}
    recovery:
      # 默认关闭；只有确认售后平台真正支持 Idempotency-Key 时才开启后台补建。
      enabled: ${SMARTCS_HANDOFF_RECOVERY_ENABLED:false}
      batch-size: ${SMARTCS_HANDOFF_RECOVERY_BATCH_SIZE:10}
      fixed-delay-ms: ${SMARTCS_HANDOFF_RECOVERY_FIXED_DELAY_MS:5000}
      # 同步线程准备 Outbox 后的首次执行宽限，避免后台与它同时调用远端。
      prepared-grace-ms: ${SMARTCS_HANDOFF_RECOVERY_PREPARED_GRACE_MS:30000}
      lease-ms: ${SMARTCS_HANDOFF_RECOVERY_LEASE_MS:30000}
      retry-delay-ms: ${SMARTCS_HANDOFF_RECOVERY_RETRY_DELAY_MS:5000}
      max-retry-delay-ms: ${SMARTCS_HANDOFF_RECOVERY_MAX_RETRY_DELAY_MS:60000}
      max-attempts: ${SMARTCS_HANDOFF_RECOVERY_MAX_ATTEMPTS:3}
  persistence:
    # memory：业务 Repository 使用内存模拟数据，会话使用 InMemorySessionStore，适合测试和 Demo。
    # jdbc：业务数据、会话和 Capability 幂等记录都使用 MySQL；会话使用 version 做 CAS。
    mode: ${SMARTCS_PERSISTENCE_MODE:memory}
    jdbc:
      driver-class-name: ${SMARTCS_JDBC_DRIVER:com.mysql.cj.jdbc.Driver}
      url: ${SMARTCS_JDBC_URL:jdbc:mysql://localhost:3306/smart_cs_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
      username: ${SMARTCS_JDBC_USERNAME:root}
      password: ${SMARTCS_JDBC_PASSWORD:}
      # 防止数据库网络黑洞时，readiness 和业务请求长期占住 Web 线程。
      connect-timeout-ms: ${SMARTCS_JDBC_CONNECT_TIMEOUT_MS:3000}
      socket-timeout-ms: ${SMARTCS_JDBC_SOCKET_TIMEOUT_MS:10000}
      query-timeout-seconds: ${SMARTCS_JDBC_QUERY_TIMEOUT_SECONDS:5}
  monitor:
    # Eval 候选样本默认保存到本地 data 目录。
    # 这样用户点“无用”后生成的待审核样本，项目重启后仍然可以继续审核。
    # 如果后续部署到服务器，可以通过环境变量 SMARTCS_MONITOR_EVAL_CANDIDATES_FILE 改成挂载目录。
    eval-candidates-file: ${SMARTCS_MONITOR_EVAL_CANDIDATES_FILE:data/feedback-eval-candidates.json}
    # 半自动合并 Eval 草稿时写入的回复质量评测文件。
    # 这个能力主要用于本地开发和面试演示：人工补齐断言后，再把 APPROVED 样本沉淀成正式回归测试。
    response-quality-eval-file: ${SMARTCS_MONITOR_RESPONSE_QUALITY_EVAL_FILE:src/test/resources/eval/response_quality_eval_cases.json}

langchain4j:
  open-ai:
    chat-model:
      # 不要把真实 API Key 写进配置文件。
      # 本地运行或 Docker 部署时，通过环境变量注入这些值。
      api-key: ${OPENAI_API_KEY:dummy-test-key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model-name: ${OPENAI_MODEL_NAME:dummy-model}
      temperature: 0.7
      max-tokens: 2000
      # LangChain4j 0.35 虽然命名为 max-retries，内部含义却是“最大总尝试次数”。
      # 安全默认值 1 = 只尝试一次、零重试；需要一次额外重试时显式设为 2，业务层不会再套重试。
      timeout: ${OPENAI_TIMEOUT:PT10S}
      max-retries: ${OPENAI_MAX_RETRIES:1}
      # Prompt 和模型回复可能包含订单、联系方式及其他用户数据，普通应用日志默认禁止记录原文。
      # 需要排障时应优先使用已脱敏的 Trace；不要在生产环境临时打开完整请求/响应日志。
      log-requests: false
      log-responses: false
