services:
  mysql:
    image: mysql:8.4.0
    container_name: smart-cs-mysql
    ports:
      # 数据面只绑回环：公网服务器上不暴露 3306；确需外部访问再手动改绑定。
      - "127.0.0.1:${SMARTCS_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${SMARTCS_MYSQL_DATABASE:-smart_cs_agent}
      MYSQL_USER: ${SMARTCS_MYSQL_USER:-smartcs}
      MYSQL_PASSWORD: ${SMARTCS_MYSQL_PASSWORD:-smartcs-local-password}
      MYSQL_ROOT_PASSWORD: ${SMARTCS_MYSQL_ROOT_PASSWORD:-root-local-password}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.7
    container_name: smart-cs-qdrant
    ports:
      # 同 MySQL：Qdrant 只绑回环（RAG_MODE=local 时甚至不依赖它）。
      - "127.0.0.1:${SMARTCS_QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  smart-cs-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-cs-agent:latest
    container_name: smart-cs-agent
    ports:
      # 容器内始终监听 8080；宿主机端口可覆盖，避免本地 nginx 或其他项目占用 8080 时无法启动。
      - "${SMARTCS_AGENT_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy-test-key}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME:-dummy-model}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-PT10S}
      # LangChain4j 0.35 中 1 表示总共只尝试一次，即默认零重试。
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-1}
      # Demo Token 签发默认关闭：公开端点会返回带 ADMIN 角色的短期 Token，只允许通过
      # docker-compose.demo.yml 在本地演示场景显式开启。
      SMARTCS_SECURITY_DEMO_ISSUER_ENABLED: ${SMARTCS_SECURITY_DEMO_ISSUER_ENABLED:-false}
      SMARTCS_SECURITY_ISSUER: ${SMARTCS_SECURITY_ISSUER:-smart-cs-agent}
      SMARTCS_SECURITY_AUDIENCE: ${SMARTCS_SECURITY_AUDIENCE:-smart-cs-api}
      SMARTCS_SECURITY_DEFAULT_TENANT_ID: ${SMARTCS_SECURITY_DEFAULT_TENANT_ID:-default}
      # JWT 密钥没有默认值：缺失时 compose 直接启动失败，避免带着仓库公开的开发密钥上线。
      SMARTCS_SECURITY_JWT_SECRET: ${SMARTCS_SECURITY_JWT_SECRET:?SMARTCS_SECURITY_JWT_SECRET must be set to a private random secret of at least 32 bytes}
      SMARTCS_SECURITY_TOKEN_TTL_SECONDS: ${SMARTCS_SECURITY_TOKEN_TTL_SECONDS:-28800}
      SMARTCS_SECURITY_CLOCK_SKEW_SECONDS: ${SMARTCS_SECURITY_CLOCK_SKEW_SECONDS:-30}
      SMARTCS_MCP_REMOTE_TOKEN: ${SMARTCS_MCP_REMOTE_TOKEN:-}
      SMARTCS_RAG_MODE: ${SMARTCS_RAG_MODE:-local}
      SMARTCS_EMBEDDING_BASE_URL: ${SMARTCS_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      SMARTCS_EMBEDDING_API_KEY: ${SMARTCS_EMBEDDING_API_KEY:-dummy-test-key}
      SMARTCS_EMBEDDING_MODEL_NAME: ${SMARTCS_EMBEDDING_MODEL_NAME:-text-embedding-3-small}
      SMARTCS_EMBEDDING_DIMENSIONS: ${SMARTCS_EMBEDDING_DIMENSIONS:-1536}
      SMARTCS_EMBEDDING_CONNECT_TIMEOUT_MS: ${SMARTCS_EMBEDDING_CONNECT_TIMEOUT_MS:-3000}
      SMARTCS_EMBEDDING_READ_TIMEOUT_MS: ${SMARTCS_EMBEDDING_READ_TIMEOUT_MS:-10000}
      SMARTCS_QDRANT_BASE_URL: ${SMARTCS_QDRANT_BASE_URL:-http://qdrant:6333}
      SMARTCS_QDRANT_COLLECTION: ${SMARTCS_QDRANT_COLLECTION:-smart_cs_knowledge}
      SMARTCS_QDRANT_CONNECT_TIMEOUT_MS: ${SMARTCS_QDRANT_CONNECT_TIMEOUT_MS:-3000}
      SMARTCS_QDRANT_READ_TIMEOUT_MS: ${SMARTCS_QDRANT_READ_TIMEOUT_MS:-10000}
      # 外部售后工单平台不能无限占用 Agent 会话线程。
      SMARTCS_AFTER_SALES_CONNECT_TIMEOUT_MS: ${SMARTCS_AFTER_SALES_CONNECT_TIMEOUT_MS:-3000}
      SMARTCS_AFTER_SALES_READ_TIMEOUT_MS: ${SMARTCS_AFTER_SALES_READ_TIMEOUT_MS:-10000}
      SMARTCS_HANDOFF_MODE: ${SMARTCS_HANDOFF_MODE:-memory}
      # 当前外部平台没有只读幂等查询协议，reconcile 必须显式返回 unavailable。
      SMARTCS_AFTER_SALES_RESULT_QUERY_MODE: ${SMARTCS_AFTER_SALES_RESULT_QUERY_MODE:-unavailable}
      # 后台恢复默认关闭；开启前必须确认售后平台真正支持 Idempotency-Key。
      SMARTCS_HANDOFF_RECOVERY_ENABLED: ${SMARTCS_HANDOFF_RECOVERY_ENABLED:-false}
      SMARTCS_HANDOFF_RECOVERY_BATCH_SIZE: ${SMARTCS_HANDOFF_RECOVERY_BATCH_SIZE:-10}
      SMARTCS_HANDOFF_RECOVERY_FIXED_DELAY_MS: ${SMARTCS_HANDOFF_RECOVERY_FIXED_DELAY_MS:-5000}
      SMARTCS_HANDOFF_RECOVERY_PREPARED_GRACE_MS: ${SMARTCS_HANDOFF_RECOVERY_PREPARED_GRACE_MS:-30000}
      SMARTCS_HANDOFF_RECOVERY_LEASE_MS: ${SMARTCS_HANDOFF_RECOVERY_LEASE_MS:-30000}
      SMARTCS_HANDOFF_RECOVERY_RETRY_DELAY_MS: ${SMARTCS_HANDOFF_RECOVERY_RETRY_DELAY_MS:-5000}
      SMARTCS_HANDOFF_RECOVERY_MAX_RETRY_DELAY_MS: ${SMARTCS_HANDOFF_RECOVERY_MAX_RETRY_DELAY_MS:-60000}
      SMARTCS_HANDOFF_RECOVERY_MAX_ATTEMPTS: ${SMARTCS_HANDOFF_RECOVERY_MAX_ATTEMPTS:-3}
      # 长期偏好和会话摘要的生命周期、容量与长度边界。
      SMARTCS_MEMORY_PREFERENCE_TTL_MS: ${SMARTCS_MEMORY_PREFERENCE_TTL_MS:-2592000000}
      SMARTCS_MEMORY_MAX_USERS: ${SMARTCS_MEMORY_MAX_USERS:-10000}
      SMARTCS_MEMORY_MAX_PREFERENCES_PER_USER: ${SMARTCS_MEMORY_MAX_PREFERENCES_PER_USER:-20}
      SMARTCS_MEMORY_MAX_PREFERENCE_LENGTH: ${SMARTCS_MEMORY_MAX_PREFERENCE_LENGTH:-80}
      SMARTCS_MEMORY_SUMMARY_MAX_LENGTH: ${SMARTCS_MEMORY_SUMMARY_MAX_LENGTH:-2000}
      # 单轮 Agent 同时受 Action 步数和 wall-clock 总时间约束，两者都必须保持为正数。
      SMARTCS_AGENT_MAX_ITERATIONS: ${SMARTCS_AGENT_MAX_ITERATIONS:-10}
      SMARTCS_AGENT_TURN_TIMEOUT_MS: ${SMARTCS_AGENT_TURN_TIMEOUT_MS:-30000}
      # LLM Action 使用独立有界线程池；Turn 剩余时间会进一步收紧单次等待时间。
      SMARTCS_LLM_EXECUTION_CALL_TIMEOUT_MS: ${SMARTCS_LLM_EXECUTION_CALL_TIMEOUT_MS:-12000}
      SMARTCS_LLM_EXECUTION_MAX_THREADS: ${SMARTCS_LLM_EXECUTION_MAX_THREADS:-8}
      SMARTCS_LLM_EXECUTION_QUEUE_CAPACITY: ${SMARTCS_LLM_EXECUTION_QUEUE_CAPACITY:-32}
      # Provider 有界执行器：deadline 负责等待时间，线程/队列上限负责资源隔离。
      SMARTCS_CAPABILITY_EXECUTION_MAX_THREADS: ${SMARTCS_CAPABILITY_EXECUTION_MAX_THREADS:-16}
      SMARTCS_CAPABILITY_EXECUTION_QUEUE_CAPACITY: ${SMARTCS_CAPABILITY_EXECUTION_QUEUE_CAPACITY:-64}
      # Compose 自带 MySQL，因此默认使用 jdbc；单独运行 JAR 时 application.yml 仍默认 memory。
      SMARTCS_PERSISTENCE_MODE: ${SMARTCS_PERSISTENCE_MODE:-jdbc}
      SMARTCS_JDBC_DRIVER: ${SMARTCS_JDBC_DRIVER:-com.mysql.cj.jdbc.Driver}
      SMARTCS_JDBC_URL: "${SMARTCS_JDBC_URL:-jdbc:mysql://mysql:3306/smart_cs_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}"
      SMARTCS_JDBC_USERNAME: ${SMARTCS_JDBC_USERNAME:-smartcs}
      SMARTCS_JDBC_PASSWORD: ${SMARTCS_JDBC_PASSWORD:-smartcs-local-password}
      SMARTCS_JDBC_CONNECT_TIMEOUT_MS: ${SMARTCS_JDBC_CONNECT_TIMEOUT_MS:-3000}
      SMARTCS_JDBC_SOCKET_TIMEOUT_MS: ${SMARTCS_JDBC_SOCKET_TIMEOUT_MS:-10000}
      SMARTCS_JDBC_QUERY_TIMEOUT_SECONDS: ${SMARTCS_JDBC_QUERY_TIMEOUT_SECONDS:-5}
      SMARTCS_JDBC_POOL_MAX_SIZE: ${SMARTCS_JDBC_POOL_MAX_SIZE:-10}
      # 闲鱼侧车通道：默认关闭；启用时端点才存在，服务令牌须与 sidecar/xianyu/.env
      # 的 CS_AGENT_TOKEN 一致（≥32 字节，启动期强度校验）。
      SMARTCS_XIANYU_ENABLED: ${SMARTCS_XIANYU_ENABLED:-false}
      SMARTCS_XIANYU_SERVICE_TOKEN: ${SMARTCS_XIANYU_SERVICE_TOKEN:-}
      # 小内存服务器（2C/3.4G）必须给 JVM 封顶；本地大内存可自行覆盖。
      JAVA_OPTS: ${SMARTCS_JAVA_OPTS:--Xmx768m -Xms256m}
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # 闲鱼侧车（BRIDGE 模式）：默认不启动，须显式 `--profile xianyu`。
  # 前提：sidecar/xianyu/.env 已就位（COOKIES_STR/CS_AGENT_TOKEN），
  # 且 agent 侧 SMARTCS_XIANYU_ENABLED=true + 同一服务令牌。
  # 本地 Mac 与服务器同时运行侧车会用同一卖家 cookie 互踢，切换见部署手册。
  smart-cs-sidecar:
    profiles: ["xianyu"]
    build:
      context: ./sidecar/xianyu
    image: smart-cs-sidecar:latest
    container_name: smart-cs-sidecar
    env_file:
      - ./sidecar/xianyu/.env
    environment:
      # 容器网络内经服务名访问 agent，覆盖 .env 里指向本机 127.0.0.1 的配置
      CS_AGENT_URL: http://smart-cs-agent:8080
      SIDECAR_MODE: BRIDGE
      TZ: Asia/Shanghai
    depends_on:
      smart-cs-agent:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  qdrant_data:
