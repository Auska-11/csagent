services:
  qdrant:
    image: qdrant/qdrant:v1.9.7
    container_name: smart-cs-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  smart-cs-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-cs-agent:latest
    container_name: smart-cs-agent
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME}
      # 生产部署必须关闭 demo issuer，并覆盖 JWT 密钥。
      SMARTCS_SECURITY_DEMO_ISSUER_ENABLED: ${SMARTCS_SECURITY_DEMO_ISSUER_ENABLED:-true}
      SMARTCS_SECURITY_ISSUER: ${SMARTCS_SECURITY_ISSUER:-smart-cs-agent}
      SMARTCS_SECURITY_AUDIENCE: ${SMARTCS_SECURITY_AUDIENCE:-smart-cs-api}
      SMARTCS_SECURITY_DEFAULT_TENANT_ID: ${SMARTCS_SECURITY_DEFAULT_TENANT_ID:-default}
      SMARTCS_SECURITY_JWT_SECRET: ${SMARTCS_SECURITY_JWT_SECRET:-dev-only-smart-cs-agent-change-this-secret-32bytes}
      SMARTCS_SECURITY_TOKEN_TTL_SECONDS: ${SMARTCS_SECURITY_TOKEN_TTL_SECONDS:-28800}
      SMARTCS_SECURITY_CLOCK_SKEW_SECONDS: ${SMARTCS_SECURITY_CLOCK_SKEW_SECONDS:-30}
      SMARTCS_MCP_REMOTE_TOKEN: ${SMARTCS_MCP_REMOTE_TOKEN:-}
      SMARTCS_RAG_MODE: ${SMARTCS_RAG_MODE:-local}
      SMARTCS_EMBEDDING_BASE_URL: ${SMARTCS_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      SMARTCS_EMBEDDING_API_KEY: ${SMARTCS_EMBEDDING_API_KEY:-dummy-test-key}
      SMARTCS_EMBEDDING_MODEL_NAME: ${SMARTCS_EMBEDDING_MODEL_NAME:-text-embedding-3-small}
      SMARTCS_EMBEDDING_DIMENSIONS: ${SMARTCS_EMBEDDING_DIMENSIONS:-1536}
      SMARTCS_QDRANT_BASE_URL: ${SMARTCS_QDRANT_BASE_URL:-http://qdrant:6333}
      SMARTCS_QDRANT_COLLECTION: ${SMARTCS_QDRANT_COLLECTION:-smart_cs_knowledge}
      # 长期偏好和会话摘要的生命周期、容量与长度边界。
      SMARTCS_MEMORY_PREFERENCE_TTL_MS: ${SMARTCS_MEMORY_PREFERENCE_TTL_MS:-2592000000}
      SMARTCS_MEMORY_MAX_USERS: ${SMARTCS_MEMORY_MAX_USERS:-10000}
      SMARTCS_MEMORY_MAX_PREFERENCES_PER_USER: ${SMARTCS_MEMORY_MAX_PREFERENCES_PER_USER:-20}
      SMARTCS_MEMORY_MAX_PREFERENCE_LENGTH: ${SMARTCS_MEMORY_MAX_PREFERENCE_LENGTH:-80}
      SMARTCS_MEMORY_SUMMARY_MAX_LENGTH: ${SMARTCS_MEMORY_SUMMARY_MAX_LENGTH:-2000}
      # 单轮 Agent Action 步数预算，必须保持为正数。
      SMARTCS_AGENT_MAX_ITERATIONS: ${SMARTCS_AGENT_MAX_ITERATIONS:-10}
      # 默认仍是 memory；使用外部 MySQL 时可在 .env 中覆盖以下配置。
      SMARTCS_PERSISTENCE_MODE: ${SMARTCS_PERSISTENCE_MODE:-memory}
      SMARTCS_JDBC_DRIVER: ${SMARTCS_JDBC_DRIVER:-com.mysql.cj.jdbc.Driver}
      SMARTCS_JDBC_URL: "${SMARTCS_JDBC_URL:-jdbc:mysql://host.docker.internal:3306/smart_cs_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}"
      SMARTCS_JDBC_USERNAME: ${SMARTCS_JDBC_USERNAME:-root}
      SMARTCS_JDBC_PASSWORD: ${SMARTCS_JDBC_PASSWORD:-}
      SMARTCS_JDBC_CONNECT_TIMEOUT_MS: ${SMARTCS_JDBC_CONNECT_TIMEOUT_MS:-3000}
      SMARTCS_JDBC_SOCKET_TIMEOUT_MS: ${SMARTCS_JDBC_SOCKET_TIMEOUT_MS:-10000}
      SMARTCS_JDBC_QUERY_TIMEOUT_SECONDS: ${SMARTCS_JDBC_QUERY_TIMEOUT_SECONDS:-5}
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
