services:
  smart-cs-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-cs-agent:latest
    container_name: smart-cs-agent
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME}
    restart: unless-stopped
