name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  sidecar:
    name: Xianyu sidecar offline tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sidecar/xianyu/requirements.txt
      - name: Install sidecar dependencies
        run: python -m pip install -r sidecar/xianyu/requirements.txt
      - name: Run offline tests
        working-directory: sidecar/xianyu
        run: python -m unittest discover -s tests -p 'test_*.py'

  test:
    name: Full-stack verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Grant Maven wrapper permission
        run: chmod +x ./mvnw

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify React frontend
        working-directory: frontend
        run: npm run typecheck && npm test && npm run build

      - name: Run unit and eval tests
        run: ./mvnw -B -P!frontend test
        env:
          # CI 不依赖真实模型 Key。项目默认会使用 Fake Judge 和 dummy 模型配置，
          # 这样可以稳定验证 Agent 路由、工具、RAG、Monitor 和 Eval 这些工程链路。
          OPENAI_API_KEY: dummy-test-key
          OPENAI_BASE_URL: https://api.openai.com/v1
          OPENAI_MODEL_NAME: dummy-model

      - name: Package default React JAR
        run: ./mvnw -B -DskipTests package

      - name: Verify Vite assets in JAR
        run: jar tf target/smart-cs-agent-0.0.1-SNAPSHOT.jar | rg 'BOOT-INF/classes/static/assets/.+\.js$'
